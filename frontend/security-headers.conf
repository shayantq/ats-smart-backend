# هدرهای امنیتی مشترک همه‌ی پاسخ‌ها — در هر بلوکی که خودش add_header دارد دوباره include می‌شود
# (چون Nginx در آن صورت add_header های سطح بالاتر را به ارث نمی‌برد).
# یافته‌های اسکن OWASP ZAP (security/) دلیل اضافه شدن CSP، Permissions-Policy و هدرهای Cross-Origin است.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# فقط منابع همین دامنه؛ بدون اسکریپت/استایل inline، بدون جاسازی در سایت دیگر (Clickjacking)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# سایت به دوربین/میکروفون/موقعیت/پرداخت نیازی ندارد — دسترسی هر اسکریپتی به آن‌ها بسته است
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# جداسازی از پنجره‌ها و منابع سایت‌های دیگر (Spectre-class / cross-origin leaks)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
