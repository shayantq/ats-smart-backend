# قالب پیکربندی Nginx فرانت‌اند — ${BACKEND_UPSTREAM} و ${NGINX_RESOLVER} هنگام
# شروع کانتینر با envsubst جایگزین می‌شوند (بنگرید Dockerfile همین پوشه).

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # حداکثر حجم آپلود رزومه در بک‌اند ۱۰ مگابایت است (app/routers/resumes.py) + سربار multipart
    client_max_body_size 12m;

    # DNS داخلی Docker: نام سرویس بک‌اند در هر درخواست (با کش ۵ ثانیه‌ای) دوباره
    # resolve می‌شود — نه فقط یک‌بار هنگام شروع nginx. این دو اثر مهم دارد:
    #  ۱. nginx حتی اگر بک‌اند هنوز بالا نیامده باشد، بدون خطا شروع می‌شود.
    #  ۲. در استقرار بدون قطعی (deploy/deploy.sh)، کانتینرهای جدید بک‌اند فوراً
    #     دیده می‌شوند و کانتینرهای قدیمی (درحال خاموش‌شدن) کنار گذاشته می‌شوند.
    resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 3s;
    set $backend_upstream ${BACKEND_UPSTREAM};

    # هدرهای امنیتی (CSP و ...) — بنگرید security-headers.conf؛ در location هایی که خودشان
    # add_header دارند دوباره include شده‌اند، چون Nginx در آن صورت این سطح را به ارث نمی‌برد
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # «/api» بدون اسلش پایانی یک مسیر API نامعتبر است، نه یک صفحه‌ی SPA (یافته‌ی اسکن ZAP)
    location = /api {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # اگر کانتینر بک‌اندی (مثلاً در حال خاموش‌شدن حین استقرار) اتصال را رد کرد،
        # همان درخواست به کانتینر سالم بعدی سپرده می‌شود — کاربر 502 نمی‌بیند
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }

    location /media/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # اگر کانتینر بک‌اندی (مثلاً در حال خاموش‌شدن حین استقرار) اتصال را رد کرد،
        # همان درخواست به کانتینر سالم بعدی سپرده می‌شود — کاربر 502 نمی‌بیند
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }

    # فایل‌های باندل‌شده‌ی Vite نام هش‌دار دارند — کش طولانی و بدون اعتبارسنجی مجدد
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA: هر مسیر ناشناخته به index.html (مسیریابی سمت کلاینت)؛ خودِ index.html
    # هرگز کش نمی‌شود تا بعد از هر استقرار، نسخه‌ی جدید فوراً به کاربر برسد
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
