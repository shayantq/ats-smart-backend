# پیکربندی اصلی Nginx (جایگزین /etc/nginx/nginx.conf پیش‌فرض ایمیج رسمی).
#
# تنها تفاوت مهم با پیش‌فرض: ظرفیت اتصال‌های هم‌زمان. پیش‌فرض ۱۰۲۴ اتصال برای هر پردازه است و
# هر درخواست پراکسی‌شده دو اتصال مصرف می‌کند (کاربر + بک‌اند)؛ در تست بار ۵۰۰۰ کاربر هم‌زمان
# همین سقف پر می‌شد و Nginx به‌جای پاسخ، خطای 502 می‌داد (بنگرید loadtest/).

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    include /etc/nginx/conf.d/*.conf;
}
