# =============================================================================
# خط لوله‌ی ادغام و استقرار مداوم (CI/CD) — ATS Smart
#
#   lint ─► test ──────┐
#   frontend (Jest) ───┴─► e2e (Playwright) ─► build-and-push ─► deploy ──────────────┐
#                                         └──► deploy-self-hosted (Runner روی سرور) ─┴─► report
#
# مدل برنچ‌ها:
# - develop = Staging: هر Push / Pull Request فقط بررسی کیفیت کد + همه‌ی تست‌ها + بیلد.
# - main = Production: Merge روی main (بعد از سبز شدن همه‌ی مراحل قبل) نسخه‌ی جدید را بدون قطعی
#   روی سرور Production مستقر و بلافاصله Sanity Check را روی دامنه‌ی اصلی اجرا می‌کند:
#     · deploy: سرور با SSH در دسترس (Secrets: SSH_* + Docker Hub)
#     · deploy-self-hosted: Runner خودمیزبان روی خود سرور (متغیر مخزن PRODUCTION_RUNNER=self-hosted) —
#       حین استقرار ترافیک زنده‌ی کاربر شبیه‌سازی و هر خطا شمرده می‌شود (deploy/traffic_probe.py)
# - شکست هر مرحله، تمام مراحل بعدی را متوقف می‌کند (needs) — کد خراب هرگز به سرور نمی‌رسد.
# - گزارش نهایی: Job Summary همین صفحه‌ی Actions + صندوق اعلان‌های داخل سایت تیم فنی.
#
# Secrets لازم (Settings → Secrets and variables → Actions) — بنگرید README:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, (اختیاری) SSH_PORT, DEPLOY_PATH
#   OPS_EVENTS_URL, OPS_WEBHOOK_TOKEN    (گزارش به اعلان‌های داخل سایت)
# تا وقتی Secrets استقرار تنظیم نشده‌اند، مراحل build/deploy با یک پیام توضیحی رد
# می‌شوند (Skip) و بقیه‌ی خط لوله (lint/test) عادی کار می‌کند.
# =============================================================================

name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# دو استقرار هم‌زمان روی یک سرور هرگز اجرا نشوند؛ اجرای قدیمی‌تر یک PR لغو می‌شود
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # گام ۱: بررسی کیفیت و استانداردهای نگارش کد
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Black + Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # فقط خود ابزارها (نه کل وابستگی‌ها) — نسخه‌ها هم‌خوان با requirements-dev.txt
      - name: Install linters
        run: pip install black==24.8.0 flake8==7.1.1

      - name: Black (formatting)
        run: black --check --diff .

      - name: Flake8 (style & errors)
        run: flake8

  # ---------------------------------------------------------------------------
  # گام ۲: تست‌های واحد و یکپارچه‌سازی روی PostgreSQL و Redis واقعی
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Pytest)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ats_ci_password
          POSTGRES_DB: ats_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ats -d ats_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ats:ats_ci_password@localhost:5432/ats_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key
      ENVIRONMENT: ci
      # تست‌های یکپارچه‌سازی در CI هرگز نباید بی‌صدا Skip شوند (بنگرید tests/integration/conftest.py)
      TEST_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # کلیدهای رمزنگاری داده‌های شخصی فقط برای همین اجرا (تصادفی، دور ریخته می‌شوند): مایگریشن و برنامه
      # بدون کلید اجرا نمی‌شوند (app/core/crypto.py)
      - name: Ephemeral PII encryption keys
        run: |
          echo "PII_ENCRYPTION_KEYS=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
          echo "PII_BLIND_INDEX_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      # تست یکپارچه‌سازی لایه‌ی دیتابیس: کل زنجیره‌ی مایگریشن‌ها روی یک PostgreSQL
      # خالی اجرا می‌شود، سپس آخرین مایگریشن برگردانده و دوباره اعمال می‌شود
      - name: Database migrations (upgrade → downgrade → upgrade)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      # تست‌های واحد + یکپارچه‌سازی (هرکدام روی یک دیتابیس موقت جدا که در پایان حذف می‌شود)
      - name: Pytest (unit + integration) with coverage
        run: pytest -v --junitxml=pytest-report.xml --cov --cov-report=term --cov-report=xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report
          path: |
            pytest-report.xml
            coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # بیلد فرانت‌اند (TypeScript type-check + Vite build) — هم‌زمان با lint/test
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      # تست‌های رندر کامپوننت‌های React (Jest + Testing Library)
      - run: npm test -- --ci
      - run: npm run build

  # ---------------------------------------------------------------------------
  # تست E2E: شبیه‌سازی کاربر واقعی در مرورگر روی کل سیستم (فرانت → بک → دیتابیس)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Start full stack (docker compose)
        run: |
          # کلیدهای رمزنگاری تصادفی همین اجرا؛ docker-compose.yml آن‌ها را از .env به سرویس‌های بک‌اند می‌دهد
          umask 077
          {
            echo "PII_ENCRYPTION_KEYS=$(openssl rand -base64 32 | tr '+/' '-_')"
            echo "PII_BLIND_INDEX_KEY=$(openssl rand -base64 32 | tr '+/' '-_')"
          } > .env
          docker compose up -d --build backend_api frontend
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/health && exit 0
            sleep 5
          done
          echo "::error::سیستم در زمان مقرر بالا نیامد" && exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run E2E scenarios
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend_api frontend

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # آیا Secrets لازم برای انتشار/استقرار تنظیم شده‌اند؟
  # ---------------------------------------------------------------------------
  preflight:
    name: Deploy preflight
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      registry_ready: ${{ steps.check.outputs.registry_ready }}
      server_ready: ${{ steps.check.outputs.server_ready }}
    steps:
      - id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          registry_ready=false; server_ready=false
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then registry_ready=true; fi
          if [[ "$registry_ready" == true && -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]; then server_ready=true; fi
          echo "registry_ready=$registry_ready" >> "$GITHUB_OUTPUT"
          echo "server_ready=$server_ready" >> "$GITHUB_OUTPUT"
          [[ "$registry_ready" == true ]] || echo "::notice::Secrets مربوط به Docker Hub تنظیم نشده‌اند — مراحل build/deploy رد می‌شوند."
          [[ "$server_ready" == true ]] || echo "::notice::Secrets مربوط به سرور (SSH_*) تنظیم نشده‌اند — مرحله‌ی deploy رد می‌شود."

  # ---------------------------------------------------------------------------
  # گام ۳: ساخت ایمیج‌های جدید Docker و ارسال به Docker Hub
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [test, frontend, e2e, preflight]
    if: needs.preflight.outputs.registry_ready == 'true'
    outputs:
      backend_image: ${{ steps.tags.outputs.backend_image }}
      frontend_image: ${{ steps.tags.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v5

      # تگ تغییرناپذیر بر اساس commit (برای Rollback دقیق) + تگ متحرک latest
      - id: tags
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "backend_image=${NAMESPACE}/ats-smart-backend:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${NAMESPACE}/ats-smart-frontend:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${NAMESPACE}/ats-smart-backend:latest" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${NAMESPACE}/ats-smart-frontend:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.tags.outputs.version }}
          tags: |
            ${{ steps.tags.outputs.backend_image }}
            ${{ steps.tags.outputs.backend_latest }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.tags.outputs.frontend_image }}
            ${{ steps.tags.outputs.frontend_latest }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # گام ۴: اتصال امن SSH به سرور و استقرار بدون قطعی (deploy/deploy.sh)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build-and-push, preflight]
    if: needs.preflight.outputs.server_ready == 'true'
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/ats-smart' }}
    steps:
      - uses: actions/checkout@v5

      # کلید خصوصی فقط در حافظه‌ی همین Runner موقت؛ known_hosts از قبل ثبت‌شده
      # (نه ssh-keyscan در لحظه) تا امکان حمله‌ی Man-in-the-Middle وجود نداشته باشد
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            # سرور اتصال بی‌صدا را حدود ۴۰ ثانیه بعد می‌بندد (مثلاً حین pull ایمیج‌ها)؛ Keepalive کوتاه‌تر از آن
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF

      # فقط فایل‌های زیرساخت (compose، اسکریپت‌های استقرار، پیکربندی مانیتورینگ، ابزار بک‌آپ) —
      # خود برنامه به‌صورت ایمیج از Docker Hub کشیده می‌شود، نه کپی سورس
      - name: Upload deployment files
        run: |
          tar czf - docker-compose.yml deploy monitoring backup \
            | ssh production "mkdir -p '${DEPLOY_PATH}' && tar xzf - -C '${DEPLOY_PATH}'"

      # نام ایمیج‌ها همین‌جا از SHA کامیت ساخته می‌شود، نه از خروجی Job قبلی: نام کاربری Docker Hub یک
      # Secret است و GitHub هر خروجی Job را که مقدار یک Secret در آن باشد، عمداً خالی می‌کند
      - name: Zero-downtime rollout
        env:
          IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          tag="sha-${GITHUB_SHA::7}"
          BACKEND_IMAGE="${IMAGE_NAMESPACE}/ats-smart-backend:${tag}"
          FRONTEND_IMAGE="${IMAGE_NAMESPACE}/ats-smart-frontend:${tag}"
          ssh production "cd '${DEPLOY_PATH}' && BACKEND_IMAGE='${BACKEND_IMAGE}' FRONTEND_IMAGE='${FRONTEND_IMAGE}' bash ./deploy/deploy.sh"

      # تست سلامت روی دامنه‌ی اصلی، از بیرون سرور (متغیر مخزن PRODUCTION_URL، مثلاً https://ats.example.com)
      - name: Sanity check on production domain
        if: vars.PRODUCTION_URL != ''
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: bash deploy/sanity_check.sh "$PRODUCTION_URL" "sha-${GITHUB_SHA::7}"

  # ---------------------------------------------------------------------------
  # گام ۴ (جایگزین): استقرار با GitHub Runner خودمیزبان روی خود سرور Production
  # برای سروری که از بیرون SSH پذیر نیست (پشت NAT/فایروال سازمان، یا محیط Production محلی):
  # Runner روی سرور نصب می‌شود و کار استقرار را خودش از GitHub می‌گیرد (اتصال فقط خروجی).
  # فعال‌سازی: متغیرهای مخزن PRODUCTION_RUNNER=self-hosted، DEPLOY_PATH، PRODUCTION_URL
  # (اختیاری PRODUCTION_PROMETHEUS_URL برای بررسی توزیع بار) — بنگرید README بخش «استقرار».
  # ---------------------------------------------------------------------------
  deploy-self-hosted:
    name: Deploy to production (self-hosted)
    runs-on: [self-hosted, ats-production]
    needs: [lint, test, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_RUNNER == 'self-hosted'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      PROMETHEUS_URL: ${{ vars.PRODUCTION_PROMETHEUS_URL }}
      MSYS_NO_PATHCONV: "1"
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ایمیج‌ها روی خود سرور و از همین کامیتِ تست‌شده ساخته می‌شوند (با کش لایه‌ها فقط کد تغییرکرده)
      - name: Build release images
        env:
          TAG: ${{ steps.version.outputs.tag }}
          # میرور بسته‌های Debian (اختیاری؛ همان مقداری که کش لایه‌های سرور با آن ساخته شده)
          DEBIAN_MIRROR: ${{ vars.DEBIAN_MIRROR }}
        run: |
          docker build --build-arg APP_VERSION="$TAG" --build-arg DEBIAN_MIRROR="$DEBIAN_MIRROR" -t "ats-smart-backend:$TAG" .
          docker build -t "ats-smart-frontend:$TAG" ./frontend

      # فقط فایل‌های زیرساخت؛ .env سرور (رازها) و deploy/release.env دست نمی‌خورند
      - name: Sync deployment files
        run: |
          mkdir -p "$DEPLOY_PATH"
          cp -r docker-compose.yml deploy monitoring backup "$DEPLOY_PATH/"

      # پایشگر ترافیک از قبل از استقرار تا بعد از Sanity Check روشن است: هر درخواست ناموفق کاربر
      # (حتی یکی) یا صدک ۹۵ بالای ۲ ثانیه = شکست این مرحله
      - name: Zero-downtime rollout under live traffic + sanity check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PY="$(command -v python3 || command -v python)"
          rm -f probe.stop probe.json
          "$PY" deploy/traffic_probe.py --url "$PRODUCTION_URL" --stop-file probe.stop --report probe.json > probe.log 2>&1 &
          probe_pid=$!
          sleep 5

          status=0
          ( cd "$DEPLOY_PATH" && BACKEND_IMAGE="ats-smart-backend:$TAG" FRONTEND_IMAGE="ats-smart-frontend:$TAG" \
              SKIP_PULL=1 PRUNE_IMAGES=0 bash ./deploy/deploy.sh ) || status=$?
          if [[ $status == 0 ]]; then
            bash deploy/sanity_check.sh "$PRODUCTION_URL" "$TAG" || status=$?
          fi

          sleep 10
          touch probe.stop
          wait "$probe_pid" || status=$?
          cat probe.log
          "$PY" deploy/release_summary.py markdown probe.json "$TAG" "$PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY" || true
          exit $status

      - name: Upload traffic probe report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zero-downtime-probe
          path: probe.json
          if-no-files-found: ignore

      # گزارش استقرار به اعلان‌های داخل سایت تیم فنی — مستقیم به خود Production (توکن از .env سرور)
      - name: Notify technical team
        if: always()
        env:
          TAG: ${{ steps.version.outputs.tag }}
          JOB_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PY="$(command -v python3 || command -v python)"
          token="$(sed -n 's/^OPS_WEBHOOK_TOKEN=//p' "$DEPLOY_PATH/.env" | tr -d '\r"')"
          [[ -n "$token" ]] || { echo "::notice::OPS_WEBHOOK_TOKEN در .env سرور نیست"; exit 0; }
          payload="$("$PY" deploy/release_summary.py event probe.json "$TAG" "$PRODUCTION_URL" "$JOB_STATUS" "$ACTOR" "$RUN_URL")"
          curl -fsS --max-time 20 -X POST "$PRODUCTION_URL/api/v1/ops/events" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data-binary "$payload" \
            || echo "::warning::ارسال گزارش به اعلان‌های داخل سایت ناموفق بود."

  # ---------------------------------------------------------------------------
  # گام ۵: گزارش موفقیت/شکست به تیم فنی
  # ---------------------------------------------------------------------------
  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [lint, test, frontend, e2e, preflight, build-and-push, deploy, deploy-self-hosted]
    if: always()
    steps:
      - name: Summarize & notify
        env:
          OPS_EVENTS_URL: ${{ secrets.OPS_EVENTS_URL }}
          OPS_WEBHOOK_TOKEN: ${{ secrets.OPS_WEBHOOK_TOKEN }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          FRONTEND: ${{ needs.frontend.result }}
          E2E: ${{ needs.e2e.result }}
          BUILD: ${{ needs.build-and-push.result }}
          DEPLOY: ${{ needs.deploy.result }}
          DEPLOY_SELF_HOSTED: ${{ needs.deploy-self-hosted.result }}
          # فقط تگ نسخه (sha-…)؛ نام کامل ایمیج شامل نام کاربری Docker Hub (Secret) است و GitHub خالی‌اش می‌کند
          RELEASE_VERSION: ${{ needs.build-and-push.outputs.version }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹️";; *) echo "⏭️";; esac; }

          overall=success
          # استقرار با Runner خودمیزبان: گزارش اعلان داخل سایت را خود همان Job به Production می‌فرستد
          [[ "$DEPLOY_SELF_HOSTED" == success || "$DEPLOY_SELF_HOSTED" == failure ]] && DEPLOY="$DEPLOY_SELF_HOSTED"
          for result in "$LINT" "$TEST" "$FRONTEND" "$E2E" "$BUILD" "$DEPLOY"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then overall=failure; fi
          done
          short_sha="${GITHUB_SHA::7}"
          first_line="$(printf '%s' "$COMMIT_MSG" | head -n1)"

          # ۱) Job Summary — در صفحه‌ی همین اجرا در GitHub Actions نمایش داده می‌شود
          {
            echo "## $( [[ $overall == success ]] && echo '✅ خط لوله موفق بود' || echo '❌ خط لوله با شکست مواجه شد')"
            echo ""
            echo "| مرحله | نتیجه |"
            echo "|---|---|"
            echo "| Lint (Black + Flake8) | $(icon "$LINT") $LINT |"
            echo "| Tests (Pytest) | $(icon "$TEST") $TEST |"
            echo "| Frontend (Jest + build) | $(icon "$FRONTEND") $FRONTEND |"
            echo "| E2E (Playwright) | $(icon "$E2E") $E2E |"
            echo "| Build & push images | $(icon "$BUILD") $BUILD |"
            echo "| Deploy | $(icon "$DEPLOY") $DEPLOY |"
            echo ""
            echo "**برنچ:** \`$BRANCH\` · **Commit:** \`$short_sha\` · **توسط:** $ACTOR"
            [[ -n "$RELEASE_VERSION" ]] && echo "" && echo "**نسخه:** \`$RELEASE_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # ۲) صندوق اعلان‌های داخل سایت (فقط برای Push روی برنچ اصلی، نه هر PR)
          if [[ "$EVENT" != push ]]; then exit 0; fi
          if [[ -z "$OPS_EVENTS_URL" || -z "$OPS_WEBHOOK_TOKEN" ]]; then
            echo "::notice::OPS_EVENTS_URL/OPS_WEBHOOK_TOKEN تنظیم نشده‌اند — گزارش به اعلان‌های داخل سایت ارسال نشد."
            exit 0
          fi

          if [[ $overall == success && "$DEPLOY" == success ]]; then
            level=success; title="استقرار موفق نسخه‌ی $short_sha روی $BRANCH"
          elif [[ $overall == success ]]; then
            level=success; title="خط لوله‌ی CI روی $BRANCH موفق بود ($short_sha)"
          else
            level=failure; title="شکست خط لوله‌ی CI/CD روی $BRANCH ($short_sha) — کد جدید مستقر نشد"
          fi
          content="$(printf 'Commit: %s\nتوسط: %s\nLint: %s | Tests: %s | Frontend: %s | E2E: %s | Build: %s | Deploy: %s\nجزئیات: %s' \
            "$first_line" "$ACTOR" "$LINT" "$TEST" "$FRONTEND" "$E2E" "$BUILD" "$DEPLOY" "$RUN_URL")"

          payload="$(jq -n --arg title "$title" --arg content "$content" --arg level "$level" \
            '{title: $title, content: $content, level: $level, category: "deployment"}')"

          # شکست ارسال گزارش، نتیجه‌ی خودِ خط لوله را تغییر نمی‌دهد (فقط هشدار)
          curl -fsS --max-time 20 --retry 3 -X POST "$OPS_EVENTS_URL" \
            -H "Authorization: Bearer $OPS_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            || echo "::warning::ارسال گزارش به اعلان‌های داخل سایت ناموفق بود."

      # خودِ اجرای Report همیشه سبز است؛ ولی اگر مرحله‌ای شکست خورده، کل Workflow قرمز بماند
      - name: Fail workflow if any stage failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
