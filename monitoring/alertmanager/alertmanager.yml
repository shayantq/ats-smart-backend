# پیکربندی Alertmanager — مسیریابی هشدارها به «کانال پیام‌رسان داخل سایت»
#
# مقصد: وب‌هوک POST /api/v1/ops/alerts بک‌اند (app/routers/ops.py) که هر هشدار
# را برای همه‌ی اعضای تیم فنی (نقش Admin) به صندوق اعلان‌های داخل سایت تبدیل
# می‌کند. احراز هویت: توکن Bearer مشترک (OPS_WEBHOOK_TOKEN) که هنگام شروع
# کانتینر در /tmp/ops_webhook_token نوشته می‌شود (بنگرید docker-compose.yml).

route:
  receiver: ats-in-app
  group_by: ["alertname", "severity"]
  # ارسال تقریباً آنی اولین هشدار هر گروه
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    # هشدارهای بحرانی تا رفع نشده‌اند هر ساعت یادآوری می‌شوند
    - matchers: ['severity="critical"']
      receiver: ats-in-app
      repeat_interval: 1h

receivers:
  - name: ats-in-app
    webhook_configs:
      - url: http://backend_api:8000/api/v1/ops/alerts
        # اطلاع‌رسانی «برطرف شد» هم ارسال شود
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/ops_webhook_token

# اگر یک مشکل هم‌زمان هشدار critical و warning داشته باشد، فقط critical ارسال شود
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["alertname"]
