# اتصال خودکار Grafana به Prometheus هنگام شروع — بدون نیاز به تنظیم دستی در UI.
# uid ثابت "prometheus" همان مقداری است که داشبوردهای monitoring/grafana/dashboards به آن ارجاع می‌دهند.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
