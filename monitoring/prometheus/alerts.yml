# قوانین هشدار هوشمند — شروط بحرانی سرور
#
# هر هشدار وقتی شرطش به مدت `for` پیوسته برقرار بماند «Firing» می‌شود (تا یک
# جهش لحظه‌ای هشدار کاذب نسازد) و Alertmanager آن را از طریق وب‌هوک به صندوق
# اعلان‌های داخل سایت تیم فنی می‌فرستد (monitoring/alertmanager/alertmanager.yml).
#
# severity:  critical = اقدام فوری  |  warning = نیازمند بررسی

groups:
  # ---------------------------------------------------------------------------
  - name: host
    rules:
      - alert: HostHighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "مصرف RAM سرور از ۸۵٪ عبور کرد"
          description: "مصرف فعلی حافظه: {{ $value | printf \"%.1f\" }}٪"

      - alert: HostHighCpuUsage
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m]))) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "مصرف CPU سرور بیش از ۵ دقیقه بالای ۸۵٪ است"
          description: "مصرف فعلی پردازنده: {{ $value | printf \"%.1f\" }}٪"

      - alert: HostLowDiskSpace
        expr: >-
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "فضای خالی دیسک کمتر از ۱۰٪ است"
          description: "فضای خالی {{ $labels.mountpoint }}: {{ $value | printf \"%.1f\" }}٪"

  # ---------------------------------------------------------------------------
  - name: api
    rules:
      - alert: ApiHighErrorRate
        expr: >-
          sum(rate(http_requests_total{job="backend_api",status=~"5.."}[2m]))
          / sum(rate(http_requests_total{job="backend_api"}[2m])) * 100 > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "نرخ خطاهای سرور (5xx) بالای ۵٪ است"
          description: "نرخ فعلی خطا: {{ $value | printf \"%.2f\" }}٪ از کل درخواست‌ها"

      - alert: ApiHighLatency
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="backend_api"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "زمان پاسخ صدک ۹۵ بک‌اند بیش از ۱ ثانیه است"
          description: "p95 فعلی: {{ $value | printf \"%.2f\" }} ثانیه"

      # absent(...): وقتی هیچ کانتینر سالمی از بک‌اند Scrape نشود (نه فقط up==0)
      - alert: BackendDown
        expr: absent(up{job="backend_api"} == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "هیچ نمونه‌ی سالمی از بک‌اند در دسترس نیست"
          description: "Prometheus نمی‌تواند هیچ کانتینر backend_api را Scrape کند."

  # ---------------------------------------------------------------------------
  - name: data-stores
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "پایگاه داده‌ی PostgreSQL در دسترس نیست"

      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "تعداد کانکشن‌های فعال دیتابیس بالای ۸۰٪ ظرفیت است"
          description: "استفاده‌ی فعلی: {{ $value | printf \"%.1f\" }}٪ از max_connections"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis (کش و صف کارها) در دسترس نیست"

      # Redis با maxmemory-policy=noeviction هیچ کاری از صف را حذف نمی‌کند؛ با پر شدن حافظه نوشتن جدید
      # (افزودن کار به صف) خطا می‌دهد — پیش از آن هشدار داده می‌شود (فقط وقتی maxmemory تنظیم شده است)
      - alert: RedisMemoryHigh
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 80 and redis_memory_max_bytes > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "حافظه‌ی Redis (Broker صف‌ها) بیش از ۸۰٪ پر است"
          description: "استفاده‌ی فعلی: {{ $value | printf \"%.1f\" }}٪ از maxmemory — با پر شدن، افزودن کار جدید به صف رد می‌شود"

  # ---------------------------------------------------------------------------
  # متریک‌های صف را هر نسخه‌ی بک‌اند گزارش می‌کند؛ max() از شمارش تکراری جلوگیری می‌کند
  - name: task-queue
    rules:
      # صف bulk عمداً هزاران ایمیل انبوه را نگه می‌دارد و آستانه‌ی جدای خودش را دارد
      - alert: QueueBacklog
        expr: max by (queue) (ats_rq_jobs{state="queued", queue!="bulk"}) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "بیش از ۵۰ کار در صف «{{ $labels.queue }}» منتظر مانده‌اند"
          description: "تعداد کارهای منتظر: {{ $value }} — Workerها کافی نیستند یا گیر کرده‌اند."

      - alert: BulkQueueStalled
        expr: max(ats_rq_jobs{queue="bulk", state="queued"}) > 0 and max(delta(ats_rq_jobs{queue="bulk", state="queued"}[15m])) >= 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "صف ایمیل‌های انبوه ۱۵ دقیقه است که کوچک نشده"
          description: "{{ $value }} ایمیل انبوه منتظر — Worker ایمیل‌ها یا سرویس SMTP را بررسی کنید."

      - alert: QueueHasNoWorkers
        expr: max by (queue) (ats_rq_queue_workers) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "هیچ Worker فعالی به صف «{{ $labels.queue }}» گوش نمی‌دهد — کارهای این صف پردازش نمی‌شوند"

      - alert: NoQueueWorkers
        expr: max(ats_rq_workers) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "هیچ Worker فعالی برای پردازش صف (رزومه/ایمیل) وجود ندارد"

      - alert: QueueJobsFailing
        expr: max(delta(ats_rq_jobs{state="failed"}[15m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "بیش از ۵ کار پس‌زمینه در ۱۵ دقیقه‌ی اخیر شکست خورده‌اند"

  # ---------------------------------------------------------------------------
  # سرویس backup زمان آخرین بک‌آپ موفق هر نوع را گزارش می‌کند (node_exporter textfile collector)
  - name: backup
    rules:
      # بک‌آپ افزایشی هر ساعت اجرا می‌شود؛ ۲ ساعت بدون موفقیت = تعهد «حداکثر ۱ ساعت هدررفت» در خطر است
      - alert: BackupWalStale
        expr: time() - ats_backup_last_success_timestamp_seconds{kind="wal"} > 2 * 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "بیش از ۲ ساعت است که بک‌آپ افزایشی (WAL) موفقی به Offsite نرفته"
          description: "آخرین بک‌آپ افزایشی موفق: {{ $value | humanizeDuration }} پیش"

      - alert: BackupFullStale
        expr: time() - ats_backup_last_success_timestamp_seconds{kind="full"} > 26 * 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "بک‌آپ کامل شبانه‌ی دیتابیس انجام نشده است"
          description: "آخرین بک‌آپ کامل موفق: {{ $value | humanizeDuration }} پیش"

      - alert: BackupResumesStale
        expr: time() - ats_backup_last_success_timestamp_seconds{kind="resumes"} > 8 * 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "بک‌آپ هفتگی فایل‌های رزومه بیش از ۸ روز است انجام نشده"

      - alert: BackupNeverSucceeded
        expr: absent(ats_backup_last_success_timestamp_seconds{kind="full"})
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "هیچ بک‌آپ کامل موفقی ثبت نشده — سرویس backup را بررسی کنید"

  # ---------------------------------------------------------------------------
  - name: monitoring-stack
    rules:
      - alert: ExporterDown
        expr: up{job=~"node|postgres|redis"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "جمع‌آورنده‌ی متریک {{ $labels.job }} در دسترس نیست"

  # ---------------------------------------------------------------------------
  # وضعیت خود کلاستر Kubernetes (kube-state-metrics) — در Docker Compose این متریک‌ها وجود ندارند و
  # این هشدارها هرگز فعال نمی‌شوند
  - name: kubernetes
    rules:
      - alert: KubePodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace="ats-smart"}[15m]) > 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} (کانتینر {{ $labels.container }}) پشت‌سرهم ری‌استارت می‌شود"
          description: "{{ $value | printf \"%.0f\" }} ری‌استارت در ۱۵ دقیقه‌ی اخیر"

      - alert: KubePodNotReady
        expr: sum by (pod) (kube_pod_status_phase{namespace="ats-smart", phase=~"Pending|Unknown|Failed"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} بیش از ۱۰ دقیقه آماده نشده است"

      - alert: KubeDeploymentReplicasMismatch
        expr: >-
          kube_deployment_spec_replicas{namespace="ats-smart"}
          != kube_deployment_status_replicas_available{namespace="ats-smart"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} به تعداد نسخه‌های مطلوبش نرسیده"
          description: "در دسترس: {{ $value }} — Pod ها Pending (کمبود منابع) یا ناسالم‌اند."

      - alert: KubeHpaMaxedOut
        expr: >-
          kube_horizontalpodautoscaler_status_current_replicas{namespace="ats-smart"}
          == kube_horizontalpodautoscaler_spec_max_replicas{namespace="ats-smart"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "HPA {{ $labels.horizontalpodautoscaler }} ۱۵ دقیقه روی حداکثر نسخه‌ها مانده"
          description: "ظرفیت مقیاس خودکار تمام شده — maxReplicas یا منابع کلاستر را افزایش دهید."

