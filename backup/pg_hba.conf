# دسترسی کلاینت‌های PostgreSQL (با -c hba_file در docker-compose.yml به سرور داده می‌شود).
# همان قواعد پیش‌فرض ایمیج رسمی postgres + یک خط برای اتصال Replication از شبکه‌ی داخلی:
# pg_basebackup (بک‌آپ فیزیکی شبانه‌ی سرویس backup) از پروتکل Replication استفاده می‌کند.
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
