# =============================================================================
# Redis — کش نشست کاربران + Message Broker صف‌های RQ + یادآورهای زمان‌بندی‌شده‌ی مصاحبه
#
# پیکربندی کامل (ماندگاری AOF با fsync ثانیه‌ای، maxmemory با noeviction، keepalive): redis.conf
# همین پوشه (ConfigMap «redis-config»). AOF روی PVC: کارهای در صف و یادآورهای rq-scheduler با
# ری‌استارت/جابه‌جایی Pod از بین نمی‌روند. یک نسخه (Recreate): دو Redis هم‌زمان روی یک فایل AOF نمی‌نویسند.
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels:
    app.kubernetes.io/name: redis
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache-queue
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache-queue
    spec:
      securityContext:
        # کاربر redis ایمیج رسمی (uid/gid 999) — مالکیت پوشه‌ی داده با fsGroup
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # بالاتر از maxmemory (384mb) — سربار بازنویسی AOF و بافر کلاینت‌ها جا دارد
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
              readOnly: true

        # Sidecar متریک‌ها: حافظه، کلاینت‌های متصل، کلیدها (Prometheus job «redis»)
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          env:
            - name: REDIS_ADDR
              value: redis://127.0.0.1:6379
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: config
          configMap:
            name: redis-config
---
# نام DNS «redis» همان چیزی است که REDIS_URL (redis://redis:6379/0) به آن اشاره می‌کند
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
