# =============================================================================
# Redis — کش نشست‌ها + Message Broker صف‌های RQ (ConfigMap «redis-config»)
# همان مقادیر docker-compose.yml (سرویس redis_cache) — هر دو هم‌زمان به‌روز شوند.
#
# اولویت این پیکربندی: «هیچ کاری از صف از دست نرود»، حتی زیر بار سنگین یا با ری‌استارت Pod.
# =============================================================================

dir /data

# --- ماندگاری ---------------------------------------------------------------
# AOF: هر دستور نوشتن (افزودن کار به صف) در فایل ثبت می‌شود؛ fsync هر ثانیه = بیشترین هدررفت
# هنگام از کار افتادن ناگهانی Node حداکثر ۱ ثانیه (always امن‌تر ولی چند برابر کندتر است)
appendonly yes
appendfsync everysec
# بازنویسی AOF با پیشوند RDB: بارگذاری سریع‌تر پس از ری‌استارت
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
# حین بازنویسی AOF هم fsync ادامه دارد (نه no-appendfsync-on-rewrite)
no-appendfsync-on-rewrite no
# اسنپ‌شات RDB به‌عنوان لایه‌ی دوم
save 900 1
save 300 100
save 60 10000

# --- حافظه ------------------------------------------------------------------
# سقف حافظه کمتر از limit کانتینر (512Mi) تا Redis پیش از OOM Kill شدن خودش مدیریت کند.
# noeviction: یک Broker صف هرگز نباید کلید (یعنی یک کار در صف!) را بی‌صدا حذف کند؛ با پر شدن حافظه
# دستور نوشتن جدید خطا می‌دهد — enqueue_task آن را لاگ می‌کند و هشدار RedisMemoryHigh از قبل فعال است.
maxmemory 384mb
maxmemory-policy noeviction
# آزادسازی حافظه‌ی کلیدهای حذف/منقضی‌شده (نتیجه‌ی کارهای تمام‌شده با result_ttl) در Thread پس‌زمینه
lazyfree-lazy-expire yes
lazyfree-lazy-user-del yes
lazyfree-lazy-server-del yes

# --- اتصال‌ها ----------------------------------------------------------------
# Worker ها اتصال BLPOP طولانی دارند؛ اتصال مرده (Pod حذف‌شده) با keepalive ۶۰ ثانیه‌ای شناسایی می‌شود
tcp-keepalive 60
timeout 0
maxclients 2000
tcp-backlog 511

# --- پایش ---------------------------------------------------------------------
# دستورهای کندتر از ۱۰ میلی‌ثانیه در SLOWLOG (redis-cli SLOWLOG GET)
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 50
