# دسترسی کلاینت‌های PostgreSQL روی Kubernetes (ConfigMap «postgres-config»؛ با -c hba_file
# به سرور داده می‌شود). عیناً همان قواعد backup/pg_hba.conf نسخه‌ی Docker Compose — هر دو هم‌زمان به‌روز شوند:
# قواعد پیش‌فرض ایمیج رسمی + اتصال Replication از شبکه‌ی داخلی برای pg_basebackup (سرویس backup).
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
