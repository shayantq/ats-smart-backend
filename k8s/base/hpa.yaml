# =============================================================================
# مقیاس‌دهی خودکار افقی (HPA) — افزایش/کاهش تعداد Pod ها بر اساس مصرف CPU
#
# درصد هدف نسبت به resources.requests.cpu هر کانتینر سنجیده می‌شود. پیش‌نیاز: metrics-server
# روی کلاستر (k8s/addons/metrics-server). کاهش نسخه‌ها با تأخیر ۵ دقیقه‌ای (stabilization)
# انجام می‌شود تا نوسان کوتاه ترافیک باعث بالا و پایین شدن مداوم Pod ها نشود.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api
  labels:
    app.kubernetes.io/name: backend-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-api
  minReplicas: 2
  # سقف با ظرفیت اتصال‌های دیتابیس هماهنگ است (DB_POOL_SIZE در config/app.env)
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
