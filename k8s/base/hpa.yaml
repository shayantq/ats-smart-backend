# =============================================================================
# مقیاس‌دهی خودکار افقی (HPA) — افزایش/کاهش خودکار تعداد Pod ها بر اساس CPU و RAM
#
# درصدها نسبت به resources.requests هر کانتینر سنجیده می‌شوند (منبع متریک: metrics-server).
# با دو متریک، HPA برای هر کدام تعداد لازم را حساب و «بیشترین» را انتخاب می‌کند: عبور CPU «یا» RAM
# از ۷۵٪ کافی است تا Pod اضافه شود؛ و فقط وقتی هر دو پایین آمدند Pod ها کم می‌شوند.
#
#   تعداد مطلوب = ⌈ تعداد فعلی × (مصرف فعلی ÷ ۷۵٪) ⌉
#
# نکته‌ی طراحی RAM: حافظه‌ی پایه‌ی هر Pod پایتون با کم شدن ترافیک تقریباً ثابت می‌ماند؛ اگر حافظه‌ی
# پایه نزدیک ۷۵٪ request بود، طبق همین فرمول HPA هرگز Pod ها را کم نمی‌کرد. برای همین request حافظه‌ی
# بک‌اند ۵۱۲Mi است (مصرف پایه حدود ۲۰۰Mi ≈ ۴۰٪) تا پس از پایان اوج، Pod ها مرحله‌به‌مرحله تا حداقل برگردند.
#
# رفتار:
#   افزایش  بدون تأخیر؛ در هر ۳۰ ثانیه تا دو برابر یا ۲ Pod (هر کدام بیشتر) — واکنش سریع به اوج ناگهانی
#   کاهش    پس از ۲ دقیقه آرامش (stabilization) و حداکثر ۱ Pod در هر ۳۰ ثانیه — بدون نوسان مداوم
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api
  labels:
    app.kubernetes.io/name: backend-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-api
  minReplicas: 2
  # سقف با ظرفیت اتصال‌های دیتابیس هماهنگ است (DB_POOL_SIZE در config/app.env)
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
---
# سرویس رزومه: آپلود رزومه در backend-api است و پردازش سنگین آن (OCR ← NER ← موتور مهارت ←
# نمره‌ی تطابق) در resume-worker (صف resumes). هر Pod اضافه یک مصرف‌کننده‌ی دیگر از همان صف است؛ OCR
# پرمصرف‌ترین بخش CPU/RAM سیستم است، پس با رسیدن موج رزومه‌ها به ۷۵٪، رزومه‌ها موازی پردازش می‌شوند.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resume-worker
  labels:
    app.kubernetes.io/name: resume-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resume-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    # Worker در حال پردازش یک رزومه با SIGTERM کارش را تمام می‌کند (Warm Shutdown)؛ کاهش آرام‌تر
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
# Worker ایمیل‌ها (صف‌های notifications ← bulk ← default): ارسال انبوه ایمیل (هزاران کار سبک پشت سر هم)
# CPU را بالا می‌برد و Worker های بیشتری صف را موازی خالی می‌کنند — ایمیل‌های تراکنشی همچنان اولویت دارند.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
# فرانت‌اند (Nginx + فایل‌های استاتیک): حافظه‌ی Nginx ثابت و مستقل از ترافیک است، پس فقط CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
