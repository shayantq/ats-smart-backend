# =============================================================================
# Worker های صف RQ — دو Deployment جدا با مقیاس خودکار مستقل (بنگرید app/core/queue.py)
#
#   worker          صف‌های notifications ← bulk ← default (به همین ترتیب اولویت): ایمیل‌های تراکنشی
#                   (OTP، تغییر وضعیت، پیشنهاد، یادآور) همیشه جلوتر از ایمیل‌های انبوه پردازش می‌شوند
#   resume-worker   صف resumes: پردازش سنگین رزومه (OCR ← NER ← موتور مهارت ← نمره‌ی تطابق)
#
# چرا جدا: یک OCR چند ده ثانیه CPU می‌گیرد؛ با Worker مشترک، موجی از رزومه‌ها ایمیل OTP کاربر را
# دقیقه‌ها پشت سر خودش نگه می‌داشت. حالا هر کدام منابع، Timeout و HPA خودش را دارد.
#
# بدون از دست رفتن کار: SIGTERM = Warm Shutdown در RQ — کار در حال اجرا پیش از خروج تمام می‌شود
# (terminationGracePeriodSeconds بیشتر از job_timeout هر صف است). اگر Pod ناگهان از بین برود، RQ
# کار «رهاشده» را با سیاست تلاش مجدد همان کار دوباره در صف می‌گذارد.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: queue-worker
spec:
  # replicas را HPA مدیریت می‌کند (hpa.yaml: ۱ تا ۴)
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: queue-worker
    spec:
      # بیشتر از job_timeout ایمیل‌ها (۱۲۰ ثانیه)
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: ats-smart-backend
          command:
            - sh
            - -c
            - until alembic current 2>/dev/null | grep -q '(head)'; do echo 'در انتظار اجرای مایگریشن‌ها ...'; sleep 3; done
          envFrom:
            - configMapRef:
                name: ats-config
            - secretRef:
                name: ats-backend-secrets
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 384Mi
      containers:
        - name: worker
          image: ats-smart-backend
          command: ["python", "-m", "app.worker", "notifications", "bulk", "default"]
          envFrom:
            - configMapRef:
                name: ats-config
            - secretRef:
                name: ats-backend-secrets
          # HPA درصد مصرف را نسبت به همین requests می‌سنجد (هدف ۷۵٪ — بنگرید hpa.yaml)
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-worker
  labels:
    app.kubernetes.io/name: resume-worker
    app.kubernetes.io/component: queue-worker
spec:
  # replicas را HPA مدیریت می‌کند (hpa.yaml: ۱ تا ۴، بر اساس CPU/RAM پردازش رزومه‌ها)
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: resume-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resume-worker
        app.kubernetes.io/component: queue-worker
    spec:
      # بیشتر از job_timeout پردازش رزومه (۳۰۰ ثانیه): Scale Down یا استقرار وسط OCR، رزومه را نصفه رها نمی‌کند
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: ats-smart-backend
          command:
            - sh
            - -c
            - until alembic current 2>/dev/null | grep -q '(head)'; do echo 'در انتظار اجرای مایگریشن‌ها ...'; sleep 3; done
          envFrom:
            - configMapRef:
                name: ats-config
            - secretRef:
                name: ats-backend-secrets
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 384Mi
      containers:
        - name: resume-worker
          image: ats-smart-backend
          command: ["python", "-m", "app.worker", "resumes"]
          envFrom:
            - configMapRef:
                name: ats-config
            - secretRef:
                name: ats-backend-secrets
          # OCR (رندر صفحه + Tesseract) و مدل spaCy پرمصرف‌ترین بخش سیستم‌اند
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # همان PVC رزومه‌ها که API در آن ذخیره می‌کند
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
