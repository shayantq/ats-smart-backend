  name: genai-worker
spec:
  template:
    spec:
      containers:
        - name: genai-worker
          env:
            - name: PII_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: ats-pii-keys
                  key: PII_ENCRYPTION_KEYS
            - name: PII_BLIND_INDEX_KEY
              valueFrom:
                secretKeyRef:
