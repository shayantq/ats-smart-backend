---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          env:
            - name: PII_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: ats-pii-keys
                  key: PII_ENCRYPTION_KEYS
            - name: PII_BLIND_INDEX_KEY
              valueFrom:
                secretKeyRef:
                  name: ats-pii-keys
                  key: PII_BLIND_INDEX_KEY
