# پیکربندی Prometheus روی Kubernetes (ConfigMap «prometheus-config»)
#
# تفاوت با monitoring/prometheus/prometheus.yml (نسخه‌ی Compose): کشف اهداف به‌جای DNS داکر با
# Kubernetes Service Discovery انجام می‌شود — هر Pod (مثلاً همه‌ی نسخه‌های HPA بک‌اند) خودکار
# و جداگانه Scrape می‌شود و Pod های حذف‌شده خودکار کنار می‌روند. نام Job ها عمداً همان نام‌های
# Compose است تا قوانین هشدار (monitoring/prometheus/alerts.yml) و داشبوردهای Grafana بدون
# تغییر روی هر دو محیط کار کنند.
#   بارگذاری مجدد بدون ری‌استارت: kubectl -n ats-smart exec deploy/prometheus -- wget -qO- --post-data= http://127.0.0.1:9090/-/reload

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ats-smart
    platform: kubernetes

rule_files:
  - /etc/prometheus/rules/alerts.yml
  # مصرف لحظه‌ای هر Pod (ats:pod_*) — مخصوص Kubernetes (recording-rules.yml همین پوشه)
  - /etc/prometheus/k8s-rules/recording-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# الگوی مشترک: فقط Pod های همین Namespace با برچسب app.kubernetes.io/name مشخص و پورت نام‌دار
scrape_configs:
  # بک‌اند FastAPI (app/core/metrics.py): RPS، Latency، نرخ خطا، صف RQ، CPU/RAM پردازه
  - job_name: backend_api
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: backend-api;http
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Pending|Succeeded|Failed
        action: drop
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  # میزبان (DaemonSet node-exporter، یک Pod روی هر Node): CPU، RAM، دیسک، شبکه
  - job_name: node
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: node-exporter;metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  # PostgreSQL (Sidecar postgres-exporter): کانکشن‌ها، تراکنش‌ها، حجم دیتابیس
  - job_name: postgres
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: postgres;metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # Redis (Sidecar redis-exporter): حافظه، کلاینت‌ها، کلیدها
  - job_name: redis
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: redis;metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # سرویس backup (Sidecar textfile): زمان/حجم آخرین بک‌آپ موفق — هشدارهای گروه backup
  # (در Compose همین متریک‌ها از node_exporter می‌آمدند)
  - job_name: backup
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: backup;metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # NGINX Ingress Controller (Namespace nginx-ingress): اتصال‌ها و درخواست‌ها + زمان پاسخ و کد وضعیت
  # به تفکیک هر Pod مقصد (upstream_server) — اثبات پخش بار و نبود 502. کشف با DNS سرویس Headless
  # (به RBAC در Namespace دیگر نیازی نیست)
  - job_name: ingress
    dns_sd_configs:
      - names: ["nginx-ingress-metrics.nginx-ingress.svc.cluster.local"]
        type: A
        port: 9113
        refresh_interval: 15s

  # وضعیت اشیای کلاستر (kube-state-metrics): Pod ها، Deployment ها، HPA، Node ها، PVC ها
  - job_name: kube-state-metrics
    honor_labels: true
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: kube-state-metrics;http-metrics
        action: keep

  # مصرف لحظه‌ای CPU/RAM/شبکه‌ی هر کانتینر (cAdvisor داخل kubelet) — از مسیر Proxy سرور API با
  # توکن ServiceAccount (ClusterRole «ats-smart-prometheus-nodes» در prometheus.yaml)
  - job_name: kubernetes-cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      # فقط متریک‌هایی که داشبوردها لازم دارند (cAdvisor صدها سری دیگر هم دارد) — حافظه‌ی Prometheus کم می‌ماند
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|oom_events_total)
        action: keep
      # UID پاد از مسیر cgroup سطح Pod (/kubepods/<qos>/pod<UID>) — روی Docker Desktop (cri-dockerd) cAdvisor
      # برچسب pod/namespace ندارد؛ recording-rules.yml با همین UID به kube_pod_info پیوند می‌زند
      - source_labels: [id]
        regex: .*/pod([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})
        target_label: uid
      # سری‌های cgroup سیستمی (نه Pod و نه کانتینر) کنار گذاشته می‌شوند
      - source_labels: [uid, container]
        regex: ;
        action: drop

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
