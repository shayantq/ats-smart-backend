# سرور مدل زبانی داخل کلاستر — رابط /v1/chat/completions با پشتیبانی response_format از نوع json_schema
# (خروجی مقید به Schema با گرامر) روی CPU. وزن‌های مدل یک بار در PVC دانلود و نگه داشته می‌شوند.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: genai-models
  labels:
    app.kubernetes.io/name: genai-inference
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ats-retain
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-inference
  labels:
    app.kubernetes.io/name: genai-inference
    app.kubernetes.io/component: genai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: genai-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genai-inference
        app.kubernetes.io/component: genai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # دانلود یک‌باره با ادامه از نقطه‌ی قطع (هدر Range) و تلاش مجدد — شبکه‌ی ناپایدار دانلود ۱ تا ۲
        # گیگابایتی را خراب نمی‌کند؛ اگر فایل کامل از قبل در PVC باشد، فوراً رد می‌شود
        - name: fetch-model
          image: python:3.11-slim
          envFrom:
            - secretRef:
                name: genai-inference-model
          command:
            - python
            - -c
            - |
              import os, time, urllib.request
              url, target = os.environ["MODEL_URL"], "/models/model.gguf"
              part = target + ".part"
              def remote_size():
                  with urllib.request.urlopen(urllib.request.Request(url, method="HEAD"), timeout=60) as r:
                      return int(r.headers["Content-Length"])
              size = remote_size()
              if os.path.exists(target) and os.path.getsize(target) == size:
                  print("مدل از قبل کامل است", flush=True); raise SystemExit(0)
              for attempt in range(1, 201):
                  have = os.path.getsize(part) if os.path.exists(part) else 0
                  if have >= size:
                      break
                  try:
                      request = urllib.request.Request(url, headers={"Range": f"bytes={have}-"})
                      with urllib.request.urlopen(request, timeout=60) as response, open(part, "ab") as out:
                          while chunk := response.read(1 << 20):
                              out.write(chunk)
                  except Exception as error:
                      print(f"تلاش {attempt}: {error} — ادامه از {have >> 20}MB", flush=True)
                      time.sleep(5)
                  print(f"{os.path.getsize(part) >> 20}/{size >> 20} MB", flush=True)
              os.replace(part, target)
              print("دانلود مدل کامل شد", flush=True)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: genai-inference
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - --model
            - /models/model.gguf
            # نام خنثی‌ای که سرویس برنامه در فیلد model می‌فرستد (GENAI_MODEL در secrets/genai.env)
            - --alias
            - ats-interview-model
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "8192"
            - --parallel
            - "1"
            - --threads
            - "6"
            # کش Prompt پیش‌فرض ۸ گیگابایت RAM است — برای VM لوکال کوچک می‌شود
            - --cache-ram
            - "256"
            - --no-webui
            - --metrics
          ports:
            - name: http
              containerPort: 8080
          # /health تا بارگذاری کامل مدل 503 می‌دهد
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "6"
              memory: 3Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: genai-models
---
apiVersion: v1
kind: Service
metadata:
  name: genai-inference
  labels:
    app.kubernetes.io/name: genai-inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: genai-inference
  ports:
    - name: http
      port: 8080
      targetPort: http
