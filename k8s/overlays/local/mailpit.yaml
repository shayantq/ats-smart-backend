# =============================================================================
# فقط محیط لوکال: Mailpit — سرور SMTP آزمایشی با رابط وب (http://localhost:8025)
#
# Worker ها ایمیل‌ها را از مسیر واقعی (smtplib ← SMTP) به این سرور می‌فرستند؛ هیچ ایمیلی بیرون نمی‌رود.
# تست صف ایمیل انبوه (k8s/queue-stress.sh) تعداد ایمیل‌های رسیده را از API همین سرویس می‌شمارد.
# در Production سرویس SMTP واقعی (SMTP_* در ConfigMap/Secret) جایگزین آن است.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/component: dev-smtp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/component: dev-smtp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.6
          env:
            - name: MP_DATABASE
              value: /data/mailpit.db
            # پیش‌فرض ۵۰۰ است؛ تست ایمیل انبوه هزاران ایمیل می‌فرستد
            - name: MP_MAX_MESSAGES
              value: "50000"
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
# رابط وب برای دیدن ایمیل‌ها از مرورگر: http://localhost:8025
apiVersion: v1
kind: Service
metadata:
  name: mailpit-ui
  labels:
    app.kubernetes.io/name: mailpit
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: http
      port: 8025
      targetPort: http
