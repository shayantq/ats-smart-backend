# فقط محیط لوکال: «Offsite» شبیه‌سازی‌شده روی یک PVC جدا (ریموت rclone از نوع local).
# در Production مقصد بک‌آپ یک فضای واقعاً بیرون از کلاستر است (S3 — k8s/base/backup/backup.env).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: offsite
  labels:
    app.kubernetes.io/name: backup
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
