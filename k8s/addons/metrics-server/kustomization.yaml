# =============================================================================
# metrics-server — منبع متریک CPU/RAM Pod ها برای HPA (k8s/base/hpa.yaml) و «kubectl top»
#
# افزونه‌ی سطح کلاستر (Namespace kube-system)؛ یک‌بار برای هر کلاستر نصب می‌شود. خیلی از
# کلاسترهای مدیریت‌شده (EKS/GKE/AKS) آن را از پیش دارند — آنجا این مرحله لازم نیست.
#   kubectl apply -k k8s/addons/metrics-server
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - components.yaml

# registry.k8s.io از ایران پاسخ 403 می‌دهد (تحریم)؛ همان نسخه از آینه‌ی رسمی Rancher روی Docker Hub
images:
  - name: registry.k8s.io/metrics-server/metrics-server
    newName: rancher/mirrored-metrics-server
    newTag: v0.7.2

patches:
  # Kubelet کلاسترهای محلی (Docker Desktop، kind، minikube) گواهی TLS خودامضا دارد
  - target:
      kind: Deployment
      name: metrics-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
