# پروژهٔ محلی مستقل؛ این فایل خودکار وارد استقرار main نمی‌شود.
name: ats-inference-local
services:
  ats-engine:
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NOPRUNE: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '4'
      OLLAMA_CONTEXT_LENGTH: '2048'
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_FLASH_ATTENTION: '1'
      OLLAMA_KV_CACHE_TYPE: f16
    volumes:
      - ../models/ollama:/models:ro
      - ../models/ats-gguf:/gguf:ro
      - ./Modelfile:/Modelfile:ro
    tmpfs: ['/models/metadata:size=16m,mode=1777']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [inference]
    healthcheck:
      test: [CMD, ollama, ps]
      interval: 15s
      timeout: 5s
      start_period: 30s
    mem_limit: 3g
    cpus: 4
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
  ats-inference:
    image: ats-inference-api:task4
    build:
      context: ..
      dockerfile: inference/Dockerfile
    environment:
      OLLAMA_URL: http://ats-engine:11434
      INFERENCE_MODEL: ${INFERENCE_MODEL:-ats-q4}
      INFERENCE_TOKENIZER: /tokenizer/tokenizer.json
      SERVICE_AUTH_PUBLIC_KEYS_DIR: /keys
      SERVICE_NAME: ats-inference
    volumes:
      - ../models/base-model:/tokenizer:ro
      - ../secrets/inference/public:/keys:ro
    ports: [127.0.0.1:8081:8081]
    networks: [inference, gateway]
    read_only: true
    tmpfs: [/tmp:size=32m]
    mem_limit: 384m
    cpus: 1
    stop_grace_period: 65s
    security_opt: [no-new-privileges:true]
networks:
  inference:
    internal: true
  gateway:
