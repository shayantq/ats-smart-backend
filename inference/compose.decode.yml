# پروفایل محلی llama.cpp؛ پورت مستقیم موتور فقط روی loopback و بدون لاگ متن است.
services:
  ats-engine:
    entrypoint: [/bin/bash, /run/ats-engine-entrypoint.sh]
    environment:
      GGML_BACKEND_PATH: /usr/lib/ollama/${INFERENCE_CUDA_VARIANT:-cuda_v13}/libggml-cuda.so
      LD_LIBRARY_PATH: /usr/lib/ollama:/usr/lib/ollama/${INFERENCE_CUDA_VARIANT:-cuda_v13}
      GGML_CUDA_GRAPH_OPT: ${INFERENCE_GRAPH_OPT:-0}
    ports: [127.0.0.1:11435:11434]
    volumes:
      - ../models/ngram:/lookup:ro
      - ./engine_entrypoint.sh:/run/ats-engine-entrypoint.sh:ro
    networks: [inference, gateway]
    command:
      - --model
      - /gguf/${INFERENCE_GGUF:-ats-q4_k_m.gguf}
      - --host
      - 0.0.0.0
      - --port
      - '11434'
      - --ctx-size
      - '${INFERENCE_ENGINE_CONTEXT:-2048}'
      - --parallel
      - '${INFERENCE_ENGINE_SLOTS:-1}'
      - --n-predict
      - '640'
      - --threads
      - '4'
      - --threads-batch
      - '4'
      - --gpu-layers
      - all
      - --flash-attn
      - 'on'
      - --load-mode
      - ${INFERENCE_LOAD_MODE:-none}
      - --offline
      - --no-webui
      - --no-context-shift
      - --cache-ram
      - '0'
      - --spec-type
      - ${INFERENCE_SPEC_TYPE:-none}
      - --lookup-cache-static
      - ${INFERENCE_STATIC_CACHE:-}
      - --log-colors
      - 'off'
      - --verbosity
      - '5'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/11434; printf "GET /health HTTP/1.0\r\n\r\n" >&3; IFS= read -r health_status_line <&3; [[ "$$health_status_line" == *"200 OK"* ]]'
      interval: 15s
      timeout: 3s
      start_period: 180s
  ats-inference:
    environment:
      INFERENCE_ENGINE: llama_cpp
      INFERENCE_PARALLEL: ${INFERENCE_GATEWAY_SLOTS:-1}
      INFERENCE_WAITING: ${INFERENCE_GATEWAY_WAITING:-4}
      INFERENCE_CPP_WARMUP: ${INFERENCE_CPP_WARMUP:-0}
