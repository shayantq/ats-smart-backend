# Gateway — تنها نقطه‌ی ورود عمومی سیستم در Production (deploy/docker-compose.prod.yml).
#
# مسیرها:
#   /grafana/  ->  Grafana (داشبوردهای مانیتورینگ؛ با ورود خودِ Grafana محافظت می‌شود)
#   /          ->  frontend (که خودش /api و /media را به بک‌اند می‌رساند)
#
# راز استقرار بدون قطعی: نام سرویس‌ها با DNS داخلی Docker در هر درخواست (با کش
# ۵ ثانیه‌ای) دوباره resolve می‌شوند؛ وقتی deploy.sh نسخه‌ی جدید یک سرویس را کنار
# نسخه‌ی قدیم بالا می‌آورد، هر دو IP برگردانده می‌شوند و اگر یکی (کانتینر در حال
# خاموش‌شدن) اتصال را رد کند، proxy_next_upstream همان درخواست را بی‌صدا به
# دیگری می‌سپارد — کاربر هیچ‌وقت 502 نمی‌بیند.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 12m;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $frontend_upstream frontend:80;
    set $grafana_upstream grafana:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Gateway لبه‌ی شبکه است: X-Forwarded-For «بازنویسی» می‌شود (نه الحاق) تا کاربر
    # نتواند با جعل این هدر، Rate Limit مبتنی بر IP بک‌اند را دور بزند
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # متریک‌های داخلی هرگز از بیرون در دسترس نباشند
    location = /metrics {
        return 404;
    }

    location /grafana/ {
        proxy_pass http://$grafana_upstream;
        # Grafana Live (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://$frontend_upstream;
    }
}
