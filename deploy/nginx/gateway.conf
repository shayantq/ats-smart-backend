# Gateway — تنها نقطه‌ی ورود عمومی سیستم در Production (deploy/docker-compose.prod.yml) و
# توزیع‌کننده‌ی بار (Load Balancer) بین همه‌ی نسخه‌های هر سرویس.
#
# مسیرها:
#   /api/ ، /media/  ->  backend_api (مستقیم؛ Round-Robin بین همه‌ی نسخه‌های بک‌اند)
#   /grafana/        ->  Grafana (داشبوردهای مانیتورینگ؛ با ورود خودِ Grafana محافظت می‌شود)
#   /                ->  frontend (فایل‌های سایت؛ Round-Robin بین نسخه‌های فرانت‌اند)
#
# راز استقرار بدون قطعی: نام سرویس‌ها با DNS داخلی Docker در هر درخواست (با کش
# ۵ ثانیه‌ای) دوباره resolve می‌شوند؛ وقتی deploy.sh نسخه‌ی جدید یک سرویس را کنار
# نسخه‌ی قدیم بالا می‌آورد، هر دو IP برگردانده می‌شوند و اگر یکی (کانتینر در حال
# خاموش‌شدن) اتصال را رد کند، proxy_next_upstream همان درخواست را بی‌صدا به
# دیگری می‌سپارد — کاربر هیچ‌وقت 502 نمی‌بیند.
#
# یافته‌ی تمرین استقرار زیر ترافیک (deploy/traffic_probe.py): وقتی کانتینر قدیمی کاملاً خارج
# می‌شود، IP آن تا انقضای کش DNS ممکن است هنوز انتخاب شود و اتصال به آن (بدون پاسخ RST) معلق
# می‌ماند. پس: کش DNS کوتاه، Timeout اتصال ۱ ثانیه (اتصال داخل شبکه‌ی Docker زیر ۱ میلی‌ثانیه است)
# و چند تلاش روی نسخه‌های دیگر — درخواست کاربر در بدترین حالت حدود ۱ ثانیه کندتر می‌شود، نه ناموفق.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# سرور مشترک (deploy/docker-compose.edge.yml): جلوی Gateway یک Reverse Proxy دیگر (Caddy) نشسته که
# HTTPS را تمام می‌کند. فقط وقتی اتصال از شبکه‌ی خصوصی Docker می‌آید (همان Proxy)، IP واقعی کاربر از
# X-Forwarded-For و پروتکل از X-Forwarded-Proto پذیرفته می‌شود؛ کاربری که مستقیم به Gateway وصل است
# (IP عمومی) نمی‌تواند با جعل این هدرها Rate Limit را دور بزند.
geo $realip_remote_addr $via_trusted_proxy {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

map "$via_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default   $scheme;
    "1:https" https;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 12m;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 3s;
    set $frontend_upstream frontend:80;
    set $backend_upstream backend_api:8000;
    set $grafana_upstream grafana:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # X-Forwarded-For «بازنویسی» می‌شود (نه الحاق) تا کاربر نتواند با جعل این هدر، Rate Limit مبتنی
    # بر IP بک‌اند را دور بزند؛ $remote_addr همان IP واقعی کاربر است (مستقیم، یا از Proxy مورد اعتماد بالا)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 5;
    proxy_next_upstream_timeout 15s;
    proxy_connect_timeout 1s;
    proxy_read_timeout 60s;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # متریک‌های داخلی هرگز از بیرون در دسترس نباشند
    location = /metrics {
        return 404;
    }

    location /grafana/ {
        proxy_pass http://$grafana_upstream;
        # Grafana Live (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # API و فایل‌های رزومه مستقیم به بک‌اند (بدون عبور از nginx فرانت‌اند) — هدرهای امنیتی همان
    # frontend/security-headers.conf (اینجا inline تا تغییر آن نیازی به ساخت مجدد Gateway نداشته باشد)
    location ~ ^/(api|media)/ {
        proxy_pass http://$backend_upstream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        proxy_pass http://$frontend_upstream;
    }
}
