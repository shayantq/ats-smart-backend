# =============================================================================
# لایه‌ی Production روی docker-compose.yml اصلی (همیشه با هم استفاده می‌شوند):
#
#   ./deploy/compose.sh <دستور>      # مثلاً: ./deploy/compose.sh ps
#
# تفاوت‌ها با محیط لوکال:
#   - هیچ سرویسی جز gateway پورت عمومی ندارد (بک‌اند، فرانت‌اند، دیتابیس و ...
#     فقط داخل شبکه‌ی ats_network در دسترس‌اند).
#   - gateway (Nginx) تنها نقطه‌ی ورود است و تنها کانتینری است که هرگز در
#     استقرار عادی جایگزین نمی‌شود — همین امکان «استقرار بدون قطعی» را می‌دهد:
#     backend_api و frontend پشت آن به‌صورت Rolling جابه‌جا می‌شوند (deploy/deploy.sh).
#   - ایمیج‌ها از Docker Hub کشیده می‌شوند (BACKEND_IMAGE/FRONTEND_IMAGE در
#     deploy/release.env که deploy.sh می‌نویسد)، نه این‌که روی سرور بیلد شوند.
#   - رازها (رمز دیتابیس، توکن عملیاتی، رمز Grafana) اجباری‌اند؛ پیش‌فرض توسعه ندارند.
#   - Zero-Trust: Worker پروفایل کارجو را با توکن سرویس امضاشده (ES256، هدر X-Internal-Auth) از API
#     می‌گیرد. کلید خصوصی Worker فقط به‌صورت Secret فایلی (/run/secrets/...) به همان کانتینر می‌رسد و API
#     فقط کلید عمومی را دارد. کلیدها را deploy/deploy.sh یک‌بار روی خود سرور در secrets/service-auth/
#     می‌سازد (هرگز در ریپو یا .env نیستند) — بنگرید docs/zero-trust/ARCHITECTURE.md.
#
# نیازمند Docker Compose نسخه‌ی 2.24.4 به بالا (برای !reset و !override).
# =============================================================================

services:
  postgres_db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در .env سرور تنظیم کنید}

  # چند نسخه‌ی هم‌زمان پشت Nginx = توزیع بار (Load Balancing) + تحمل خرابی یک کانتینر
  backend_api:
    ports: !reset []
    scale: ${BACKEND_REPLICAS:-3}
    environment:
      ENVIRONMENT: production
      # درخواست‌ها فقط از Nginx داخلی می‌رسند (پورت بک‌اند بیرون باز نیست)، پس
      # هدر X-Forwarded-For قابل اعتماد است — Rate Limit روی IP واقعی کاربر اعمال می‌شود
      FORWARDED_ALLOW_IPS: "*"
      OPS_WEBHOOK_TOKEN: ${OPS_WEBHOOK_TOKEN:?OPS_WEBHOOK_TOKEN را در .env سرور تنظیم کنید}
      SERVICE_NAME: backend-api
      SERVICE_AUTH_PUBLIC_KEYS_DIR: /run/service-auth/public
    volumes:
      # فقط کلیدهای عمومی سرویس‌های مجاز (محرمانه نیستند)
      - ./secrets/service-auth/public:/run/service-auth/public:ro

  worker:
    environment:
      ENVIRONMENT: production
      SERVICE_NAME: worker
      SERVICE_AUTH_PRIVATE_KEY_FILE: /run/secrets/worker_service_key
      INTERNAL_API_URL: http://backend_api:8000
    secrets:
      - worker_service_key

  scheduler:
    environment:
      ENVIRONMENT: production

  migrate:
    environment:
      ENVIRONMENT: production

  frontend:
    ports: !reset []
    scale: ${FRONTEND_REPLICAS:-2}

  prometheus:
    # فقط از خودِ سرور (مثلاً با SSH Tunnel) — نه از اینترنت
    ports: !override
      - "${PROMETHEUS_BIND:-127.0.0.1:9090}:9090"

  alertmanager:
    ports: !override
      - "${ALERTMANAGER_BIND:-127.0.0.1:9093}:9093"
    environment:
      OPS_WEBHOOK_TOKEN: ${OPS_WEBHOOK_TOKEN:?OPS_WEBHOOK_TOKEN را در .env سرور تنظیم کنید}

  grafana:
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD را در .env سرور تنظیم کنید}
      # Grafana از مسیر https://<دامنه>/grafana/ و از طریق gateway در دسترس است
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL را در .env سرور تنظیم کنید}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

  # Offsite واقعی: فضایی بیرون از این سرور (پیش‌فرض S3 یا هر سرویس سازگار) — شبیه‌ساز لوکال خاموش
  # BACKUP_AGE_RECIPIENT (کلید عمومی age1...) و OFFSITE_S3_* در .env سرور لازم‌اند؛ عمداً اجباری
  # نشده‌اند تا نبودشان استقرار را نشکند — سرویس خطا می‌دهد و هشدار BackupNeverSucceeded می‌آید
  backup:
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: ${OFFSITE_TYPE:-s3}
      RCLONE_CONFIG_OFFSITE_HOST: ${OFFSITE_SFTP_HOST:-}
      OFFSITE_SFTP_PASSWORD: ${OFFSITE_SFTP_PASSWORD:-}

  # شبیه‌ساز Offsite فقط وقتی Offsite واقعی در دسترس نیست (COMPOSE_PROFILES=local-offsite در .env)
  offsite_storage:
    profiles: ["local-offsite"]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # ظرفیت اتصال‌های هم‌زمان بالاتر از پیش‌فرض ۱۰۲۴ (یافته‌ی تست بار)
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/gateway-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ats_network

# کلید خصوصی سرویس Worker — فایل روی خود سرور (deploy/deploy.sh می‌سازد)، به کانتینر فقط به‌صورت فایل
secrets:
  worker_service_key:
    file: ./secrets/service-auth/worker.key
